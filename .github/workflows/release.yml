name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  move-major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move major version tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping major-tag update for non-semver tag: $tag"
            exit 0
          fi
          major="${tag%%.*}"
          git tag -f "$major" "$tag"
          git push origin "refs/tags/$major" --force
