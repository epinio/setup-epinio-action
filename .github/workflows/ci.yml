name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Ensure dist is committed
        run: git diff --exit-code -- dist

  smoke:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Epinio
        id: setup
        uses: ./
        with:
          version: latest

      - name: Verify CLI
        shell: bash
        run: |
          set -euo pipefail
          epinio --version
          test -n "${{ steps.setup.outputs.version }}"
          echo "resolved=${{ steps.setup.outputs.version }}"

  pinned-version:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pinned Epinio
        id: setup
        uses: ./
        with:
          version: "1.14.2"

      - name: Verify pinned version
        run: |
          set -euo pipefail
          test "${{ steps.setup.outputs.version }}" = "1.14.2"
          epinio --version

  token-auth:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Epinio with token auth
        uses: ./
        with:
          version: "1.14.2"
          url: https://epinio.example.com
          token: ci-test-token
          namespace: workspace

      - name: Verify settings via EPINIO_SETTINGS
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EPINIO_SETTINGS:-}"
          test -f "$EPINIO_SETTINGS"
          grep -F 'api: "https://epinio.example.com"' "$EPINIO_SETTINGS"
          grep -F 'wss: "wss://epinio.example.com"' "$EPINIO_SETTINGS"
          grep -F 'accesstoken: "ci-test-token"' "$EPINIO_SETTINGS"
          grep -F 'namespace: "workspace"' "$EPINIO_SETTINGS"
          # Confirm the CLI resolves the same settings file on this OS
          epinio settings show
